<style>
:root{--navy:#32375f;--salmon:#ea878a;--teal:#69a9a9;--orange:#FF8E4B;--bg:#f4f5fa;--line:#e2e4ee;--muted:#6b7090;--danger:#d64545;--ok:#3f8f8f}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--navy);background:var(--bg);font-size:14px;line-height:1.5}
h1,h2,h3,h4,.brand,.stat b{font-family:'Baloo Chettan 2',Poppins,sans-serif;line-height:1.15}
h2{font-size:30px;margin:2px 0 4px}h3{font-size:21px;margin:0 0 4px}h4{font-size:17px;margin:0}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:18px;padding:12px 28px;position:sticky;top:0;z-index:30}
.brand-ico{height:38px;width:38px}.brand-word{height:40px;width:auto;margin-left:-6px}
.hero-logo{height:64px;width:auto;display:block;margin:0 0 18px}
.top .sub{font-size:14px;opacity:.9;border-left:1px solid rgba(255,255,255,.25);padding-left:16px;margin-left:6px}
.save{margin-left:auto;font-size:12px;opacity:.8;white-space:nowrap}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;max-width:1240px;margin:0 auto;padding:28px}
nav .sticky{position:sticky;top:86px}
nav ol{list-style:none;padding:0;margin:0}
nav li button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:12px;width:100%;box-sizing:border-box;font-size:14px}
nav li button:hover{background:#fff}
nav li.active button{background:#fff;box-shadow:0 1px 4px rgba(50,55,95,.12);font-weight:600}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;border:2px solid var(--line);background:#fff;flex:none;color:var(--muted)}
li.done .dot{background:var(--teal);border-color:var(--teal);color:#fff}
li.warn .dot{border-color:var(--orange);color:var(--orange)}
li.active .dot{border-color:var(--navy);color:var(--navy)}
li.active.done .dot{color:#fff}
.prog{margin:18px 12px 0;font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}.bar div{height:100%;background:var(--teal);transition:width .3s}
.help{margin:18px 12px 0;font-size:12px;color:var(--muted)}
.head{margin-bottom:18px}.eyebrow{font-size:12px;font-weight:600;color:var(--salmon);text-transform:uppercase;letter-spacing:.8px}
.card{background:#fff;border-radius:18px;padding:24px 26px;box-shadow:0 1px 3px rgba(50,55,95,.07);margin-bottom:18px}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.mini{font-size:12px;color:var(--muted)}.mut{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px 16px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500}
label.f small{font-weight:400;color:var(--muted)}
.req{color:var(--salmon);font-style:normal}
label.inline{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
input,select,textarea{font:inherit;color:inherit;border:1.5px solid var(--line);border-radius:10px;padding:8px 11px;background:#fff;outline:none;width:100%;min-width:0}
textarea{resize:vertical}
label.inline select{width:auto}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(105,169,169,.18)}
input.bad,select.bad{border-color:var(--danger);background:#fff7f7}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:999px;font-weight:600;font-size:14px;transition:filter .15s,background .15s;text-align:center}
.btn:hover{filter:brightness(1.07)}
.btn.primary{background:var(--navy);color:#fff}.btn.accent{background:var(--salmon);color:#fff}
.btn.ghost{border:1.5px solid var(--line);background:#fff}.btn.ghost:hover{border-color:var(--teal)}
.btn.sm{padding:5px 12px;font-size:12.5px}.btn.lg{padding:12px 26px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.icon{all:unset;cursor:pointer;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:13px}.icon:hover{background:#fdeeee;color:var(--danger)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}.row.end{justify-content:flex-end}
.row.add{margin-top:6px;margin-bottom:12px;max-width:520px;flex-wrap:nowrap}
.toggles{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.toggle{all:unset;cursor:pointer;display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;background:#fff}
.toggle.sm{padding:3px 11px;font-size:12px}
.toggle.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.sug{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0 10px}
.sug .toggle{border-style:dashed}
.lvrow{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.lvrow.on{border-color:var(--teal);background:#f6fbfb}
.check{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:600;min-width:200px}
.box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-size:13px;background:#fff}
.check.on .box{background:var(--teal);border-color:var(--teal)}
.lvopts{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.tablewrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.t{width:100%;border-collapse:collapse}
.t th,.t td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.t th{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.t td input,.t td select{padding:6px 8px;font-size:13px}
.c{text-align:center!important}.r{text-align:right!important;width:36px}.nowrap{white-space:nowrap}
.t tr.brk td{background:#fafbfd}.t tr.brk td:first-child{border-left:3px solid var(--salmon)}
.t.mods{max-width:620px}.t.mods input[type=time]{width:120px}
.num{width:60px!important;text-align:center;padding:6px 4px!important}.num.all{border-style:dashed}
.t.mat td:first-child{min-width:200px}.t tr.tot td{font-weight:600;border-bottom:none;color:var(--muted)}
.t.users td{min-width:110px}.t.users td:first-child select{min-width:175px}.t.users td.r{min-width:0}.w-dni{width:110px}
.t.asg select{min-width:170px}.t.asg select.empty-sel{color:var(--muted);border-style:dashed}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.stepper button{all:unset;cursor:pointer;width:30px;height:30px;text-align:center;font-weight:700;font-size:16px;line-height:30px}
.stepper button:hover{background:var(--bg)}
.stepper span{min-width:24px;text-align:center;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.div-chip{display:inline-flex;gap:4px;align-items:center;background:var(--bg);border-radius:10px;padding:4px}
.div-chip input{width:64px}.div-chip select{width:auto}
.lvtag{all:unset;cursor:pointer;font-size:11px;font-weight:600;border:1.5px solid var(--line);border-radius:6px;padding:2px 6px;margin-right:3px;color:var(--muted)}
.lvtag.on{background:var(--teal);border-color:var(--teal);color:#fff}
.turno{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}.turno:first-of-type{border-top:none;margin-top:6px;padding-top:0}
.gen{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-items:end;background:#f6fbfb;border:1.5px dashed var(--teal);border-radius:14px;padding:14px;margin:6px 0 12px}
.sub{margin-top:18px}.sub h4{margin-bottom:6px}
.empty{color:var(--muted);font-size:13px;font-style:italic;margin:10px 0}
.alert{border-radius:14px;padding:12px 16px;font-size:13px;margin:0 0 18px}
.alert ul{margin:6px 0 0;padding-left:18px}
.alert.info{background:#e9f3f3}.alert.warn{background:#fff2e9}.alert.bad{background:#fdeeee}.alert.ok{background:#e6f4ef;color:#1f6b55}
.alert.sm{padding:8px 12px;font-size:12px;margin-bottom:12px}
li.w,.w{color:#c4631f}li.e,.e{color:var(--danger)}
.pill{background:var(--bg);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600}
.row.alt{margin-top:12px}
.dz{display:flex;align-items:center;justify-content:center;text-align:center;border:2px dashed var(--line);border-radius:14px;padding:22px;cursor:pointer;color:var(--muted);font-size:13px;flex:1;min-width:220px;transition:all .15s}
.dz:hover,.dz.over{border-color:var(--teal);background:#f6fbfb;color:var(--navy)}
.logo-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.logo-prev{max-width:140px;max-height:90px;object-fit:contain;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff}
.opts3{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin:8px 0 12px}
.opt{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.opt small{color:var(--muted);font-size:12px}.opt.on{border-color:var(--teal);background:#f6fbfb;box-shadow:0 0 0 3px rgba(105,169,169,.15)}
.files{list-style:none;padding:0;margin:0 0 10px}.files li{display:flex;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.files li span:first-child{flex:1}
.hero{background:linear-gradient(135deg,#fff 60%,#fdf1f1);padding:34px}
.hero h2{font-size:34px}.hero p{max-width:720px}
.need{background:var(--bg);border-radius:14px;padding:16px 20px;margin:18px 0}.need ul{margin:8px 0 0;padding-left:18px}.need li{margin:3px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.stat{background:var(--bg);border-radius:14px;padding:14px 16px}.stat b{font-size:32px;display:block;color:var(--navy)}.stat span{font-size:12px;color:var(--muted)}
.issue{border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:10px}.issue .cardhead{margin:0}.issue ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.checkline{display:flex;gap:10px;align-items:flex-start;font-size:13px;cursor:pointer}.checkline input{width:18px;height:18px;margin-top:2px;flex:none}
#navbtns{display:flex;justify-content:space-between;margin:6px 0 40px}
#modal .mbg{position:fixed;inset:0;background:rgba(30,33,60,.45);display:grid;place-items:center;z-index:50;padding:20px}
#modal .mbox{background:#fff;border-radius:18px;padding:24px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.2)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--navy);color:#fff;padding:11px 20px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:880px){
 .layout{grid-template-columns:minmax(0,1fr);padding:14px;gap:12px}
 .layout>*{min-width:0}
 .save{font-size:11px;white-space:normal;text-align:right}
 nav .sticky{position:static}
 nav ol{display:flex;overflow-x:auto;gap:2px;padding-bottom:4px}
 nav li button{padding:6px}
 nav li .lbl{display:none}nav li.active .lbl{display:inline}
 .prog,.help{display:none}
 .top{padding:10px 14px;gap:10px}.brand-word{height:32px}.top .sub{display:none}
 .card{padding:18px}.hero{padding:22px}h2{font-size:25px}
}
</style>
</head>

const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getPath = (o,p) => p.split('.').reduce((a,k) => a == null ? undefined : a[k], o);
function setPath(o,p,v){const ks=p.split('.');let a=o;for(let i=0;i<ks.length-1;i++){if(a[ks[i]]==null)a[ks[i]]={};a=a[ks[i]]}a[ks[ks.length-1]]=v}
const lvDef = id => LEVELS.find(l => l.id === id);
const lvLabel = id => id === 'otro' ? (S.niveles.otro.nombre.trim() || 'Otro nivel') : lvDef(id).label;
const lvShort = id => id === 'otro' ? (S.niveles.otro.nombre.trim().slice(0,2) || 'Ot') : lvDef(id).short;
const activeLevels = () => LEVELS.filter(l => S.niveles[l.id] && S.niveles[l.id].on).map(l => l.id);
const toMin = t => { if(!/^\d{2}:\d{2}$/.test(t||'')) return null; const [h,m] = t.split(':').map(Number); return h*60+m; };
const fromMin = m => { m = ((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };
const reEmail = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function cuitOk(c){c=String(c||'').replace(/\D/g,'');if(c.length!==11)return false;const m=[5,4,3,2,7,6,5,4,3,2];let s=0;for(let i=0;i<10;i++)s+=m[i]*+c[i];let r=11-(s%11);if(r===11)r=0;if(r===10)r=9;return r===+c[10]}
const dniOk = d => /^\d{7,8}$/.test(String(d||'').replace(/[.\s]/g,''));
const validV = (k,v) => k==='email' ? reEmail.test(v) : k==='dni' ? dniOk(v) : k==='cuit' ? cuitOk(v) : true;
const divName = (scheme,i) => scheme==='numeros' ? String(i+1) : (i<26 ? String.fromCharCode(65+i) : 'D'+(i+1));
const userName = u => [u.apellido,u.nombre].filter(x=>x&&x.trim()).join(', ') || '(sin nombre)';
const fmtSize = b => b>1048576 ? (b/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(b/1024))+' KB';
const dupes = a => { const s=new Set, d=new Set; a.forEach(x => s.has(x) ? d.add(x) : s.add(x)); return [...d]; };

    niveles, ciclo:{inicio:'',fin:'',periodo:'Trimestres'},

    confirmado:false, enviado:null};
}

try { S = JSON.parse(localStorage.getItem(LS_KEY)); } catch(e) {}
S = (S && S.v === 1) ? Object.assign(blank(), S) : blank();

function save(){
  clearTimeout(saveT); $('#save').textContent = 'Guardando…';
  saveT = setTimeout(() => {
    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); $('#save').textContent = '✓ Avance guardado en este navegador'; }

  }, 350);
}

/* ---------- archivos (IndexedDB) ---------- */
const memFiles = {};
const IDB = {
  db:null,
  open(){ if(this.db) return Promise.resolve(this.db); return new Promise((res,rej)=>{ try{ const r=indexedDB.open('sabium-alta',1); r.onupgradeneeded=()=>r.result.createObjectStore('files'); r.onsuccess=()=>{this.db=r.result;res(this.db)}; r.onerror=()=>rej(r.error);}catch(e){rej(e)} }); },
  async tx(mode,fn){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction('files',mode); const r=fn(t.objectStore('files')); t.oncomplete=()=>res(r&&r.result); t.onerror=()=>rej(t.error); }); }
};
async function putFile(id,blob){ memFiles[id]=blob; try{ await IDB.tx('readwrite',s=>s.put(blob,id)); }catch(e){} }
async function getFile(id){ if(memFiles[id]) return memFiles[id]; try{ const b=await IDB.tx('readonly',s=>s.get(id)); if(b) memFiles[id]=b; return b||null; }catch(e){ return null; } }
async function delFile(id){ delete memFiles[id]; try{ await IDB.tx('readwrite',s=>s.delete(id)); }catch(e){} }

/* ---------- helpers de modelo ---------- */
function ensureLevel(l){
  if(!S.nomen[l]) S.nomen[l] = 'letras';
  if(!S.cursos[l]) S.cursos[l] = lvDef(l).cursos.map(n => ({id:uid(), nombre:n, divisiones:[newDiv(l,0)]}));
  if(!S.modulos[l]) S.modulos[l] = {};
  if(!S.horModo[l]) S.horModo[l] = 'archivo';
  if(!S.horArch[l]) S.horArch[l] = [];
  if(!S.materias[l]) S.materias[l] = [];
  if(!S.curricular[l]) S.curricular[l] = {modo:'', archivos:[], nota:''};
}
function newDiv(l,i,prev){ const sch = S.nomen[l]||'letras'; return {id:uid(), nombre:divName(sch==='libre'?'letras':sch,i), turno: prev ? prev.turno : (S.niveles[l].turnos[0]||'Mañana')}; }
function fixTurnos(l){ const ts=S.niveles[l].turnos; (S.cursos[l]||[]).forEach(c=>c.divisiones.forEach(d=>{ if(!ts.includes(d.turno)) d.turno = ts[0]||''; })); }
function modArr(l,t){ S.modulos[l]=S.modulos[l]||{}; return S.modulos[l][t]=S.modulos[l][t]||[]; }
function addMateria(l,n){
  if(S.materias[l].some(m=>m.nombre.trim().toLowerCase()===n.trim().toLowerCase())){ toast('Esa materia ya está cargada'); return; }
  S.materias[l].push({id:uid(), nombre:n.trim(), horas:{}}); save(); render();
}
function asignRows(l){ const out=[]; (S.cursos[l]||[]).forEach(c=>(S.materias[l]||[]).forEach(m=>{ const h=(m.horas||{})[c.id]||0; if(h>0) c.divisiones.forEach(d=>out.push({l,c,m,d,h,key:d.id+'|'+m.id})); })); return out; }
function asignStats(){ let total=0,done=0; activeLevels().forEach(l=>asignRows(l).forEach(r=>{ total++; if(S.asign[r.key] && S.usuarios.some(u=>u.id===S.asign[r.key])) done++; })); return {total,done}; }
const hasData = () => !!(S.inst.nombre || S.usuarios.length || activeLevels().length);

/* ---------- validaciones ---------- */
function check(id){
  const err=[], warn=[], A=activeLevels();
  switch(id){
  case 'inst': { const i=S.inst, c=S.contacto;
    if(!i.nombre.trim()) err.push('Falta el nombre de la institución.');
    if(!i.razon.trim()) err.push('Falta la razón social.');
    if(!cuitOk(i.cuit)) err.push(i.cuit ? 'El CUIT no es válido: revisá los 11 dígitos.' : 'Falta el CUIT.');
    if(!i.direccion.trim()) err.push('Falta la dirección.');
    if(!i.localidad.trim()) err.push('Falta la localidad.');
    if(!i.provincia) err.push('Elegí la provincia.');
    if(!i.telefono.trim()) err.push('Falta el teléfono de la institución.');
    if(!reEmail.test(i.email)) err.push(i.email ? 'El email institucional no es válido.' : 'Falta el email institucional.');
    if(!i.logo) warn.push('Todavía no subiste el logo.');
    if(!c.nombre.trim()) err.push('Falta el nombre de la persona de contacto.');
    if(!reEmail.test(c.email)) err.push('Falta un email válido de la persona de contacto.');
    if(!c.telefono.trim()) err.push('Falta el teléfono de la persona de contacto.');
    break; }
  case 'niveles':
    if(!A.length) err.push('Marcá al menos un nivel.');
    A.forEach(l=>{ if(!S.niveles[l].turnos.length) err.push(`${lvLabel(l)}: marcá al menos un turno.`); });
    if(S.niveles.otro.on && !S.niveles.otro.nombre.trim()) err.push('Poné un nombre al "otro nivel o modalidad".');
    if(!S.ciclo.inicio || !S.ciclo.fin) warn.push('Faltan las fechas del ciclo lectivo.');
    else if(S.ciclo.fin <= S.ciclo.inicio) err.push('La fecha de fin del ciclo lectivo tiene que ser posterior al inicio.');
    break;
  case 'cursos':
    A.forEach(l=>{ const cs=S.cursos[l]||[]; if(!cs.length) err.push(`${lvLabel(l)}: agregá al menos un curso.`);
      cs.forEach(c=>{ const tag=`${lvLabel(l)} · ${c.nombre||'curso sin nombre'}`;
        if(!c.nombre.trim()) err.push(`${lvLabel(l)}: hay un curso sin nombre.`);
        if(!c.divisiones.length) warn.push(`${tag}: no tiene divisiones (no se abre este año).`);
        const ns=c.divisiones.map(d=>d.nombre.trim().toLowerCase());
        if(ns.some(n=>!n)) err.push(`${tag}: hay una división sin nombre.`);
        else if(new Set(ns).size!==ns.length) err.push(`${tag}: hay divisiones con el mismo nombre.`);
      }); });
    break;
  case 'horarios':
    A.forEach(l=>{ if(S.horModo[l]==='archivo' && !(S.horArch[l]||[]).length) err.push(`${lvLabel(l)}: subí el archivo con los horarios.`); });
    A.filter(l=>S.horModo[l]!=='archivo').forEach(l=>S.niveles[l].turnos.forEach(t=>{ const ms=(S.modulos[l]||{})[t]||[]; const tag=`${lvLabel(l)} · turno ${t}`;
      if(!ms.some(m=>m.tipo==='Clase')) { err.push(`${tag}: cargá los módulos.`); return; }
      const v=ms.map(m=>({...m,a:toMin(m.inicio),b:toMin(m.fin)}));
      if(v.some(m=>m.a==null||m.b==null)) { err.push(`${tag}: hay horarios incompletos.`); return; }
      if(v.some(m=>m.b<=m.a)) err.push(`${tag}: hay módulos que terminan antes de empezar.`);
      const s=[...v].sort((x,y)=>x.a-y.a);
      for(let k=1;k<s.length;k++) if(s[k].a<s[k-1].b){ err.push(`${tag}: hay módulos superpuestos (${s[k-1].inicio}–${s[k-1].fin} y ${s[k].inicio}–${s[k].fin}).`); break; }
    }));
    break;
  case 'materias':
    A.forEach(l=>{ const ms=S.materias[l]||[]; if(!ms.length){ err.push(`${lvLabel(l)}: agregá las materias.`); return; }
      ms.forEach(m=>{ if(!m.nombre.trim()) err.push(`${lvLabel(l)}: hay una materia sin nombre.`);
        else if(!Object.values(m.horas||{}).some(h=>h>0)) warn.push(`${lvLabel(l)} · ${m.nombre}: no tiene módulos en ningún curso.`); });
      (S.cursos[l]||[]).forEach(c=>{ if(!ms.some(m=>((m.horas||{})[c.id]||0)>0)) warn.push(`${lvLabel(l)} · ${c.nombre}: todavía no tiene materias con módulos.`); });
    });
    break;
  case 'equipo': { const U=S.usuarios;
    if(!U.some(u=>u.rol==='Director/a general')) err.push('Cargá al menos una persona con cargo Director/a general.');
    if(!U.some(u=>u.rol==='Docente')) warn.push('Todavía no cargaste docentes.');
    let inc=0,bd=0,be=0; U.forEach(u=>{ if(!u.nombre.trim()||!u.apellido.trim()) inc++; if(!dniOk(u.dni)) bd++; if(!reEmail.test(u.email||'')) be++; });
    if(inc) err.push(`${inc} persona(s) sin nombre o apellido.`);
    if(bd) err.push(`${bd} persona(s) con DNI faltante o inválido.`);
    if(be) err.push(`${be} persona(s) con email faltante o inválido.`);
    const dd=dupes(U.map(u=>String(u.dni).replace(/[.\s]/g,'')).filter(Boolean)), de=dupes(U.map(u=>(u.email||'').toLowerCase()).filter(Boolean));
    if(dd.length) err.push('DNI repetidos: '+dd.join(', '));
    if(de.length) err.push('Emails repetidos: '+de.join(', '));
    break; }
  case 'asign': { const {total,done}=asignStats();
    if(!total) warn.push('No hay materias con módulos para asignar.');
    else if(done<total) warn.push(`Faltan definir ${total-done} de ${total} asignaciones (podés completarlas después).`);
    break; }
  case 'curricular':
    A.forEach(l=>{ const c=S.curricular[l]||{};
      if(!c.modo) err.push(`${lvLabel(l)}: indicá cómo nos vas a hacer llegar el diseño curricular.`);
      else if(c.modo==='archivo' && !(c.archivos||[]).length) err.push(`${lvLabel(l)}: subí al menos un archivo.`); });
    break;
  }
  return {err, warn};
}
function status(i){
  const id=STEPS[i].id;
  if(id==='inicio') return S.visited.includes(0) ? 'done' : '';
  if(id==='envio') return S.enviado ? 'done' : '';
  if(!S.visited.includes(i)) return '';
  return check(id).err.length ? 'warn' : 'done';
}

/* ---------- componentes ---------- */
function fld(label,path,o={}){
  const v = getPath(S,path) ?? '';
  const bad = o.v && v && !validV(o.v,v) ? ' bad' : '';
  const input = o.options
    ? `<select data-path="${path}"><option value="">Elegí…</option>${o.options.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`
    : `<input data-path="${path}" type="${o.type||'text'}" value="${esc(v)}" placeholder="${esc(o.ph||'')}"${o.v?` data-v="${o.v}"`:''}${o.im?` inputmode="${o.im}"`:''} class="${bad}">`;
  return `<label class="f"><span>${esc(label)}${o.req?' <i class="req">*</i>':''}</span>${o.hint?`<small>${esc(o.hint)}</small>`:''}${input}</label>`;
}
const dz = (kind,lv,text,accept,multiple) => `<label class="dz" data-dz="${kind}" data-lv="${lv}"><input type="file" hidden data-file="${kind}" data-lv="${lv}" accept="${accept}"${multiple?' multiple':''}><span>${text}</span></label>`;

    ${S.horArch[l].length?`<ul class="files">${S.horArch[l].map((f,fi)=>`<li><span>${esc(f.name)}</span><span class="mut">${fmtSize(f.size)}</span><button class="icon" data-act="delHor" data-lv="${l}" data-fi="${fi}" title="Quitar">✕</button></li>`).join('')}</ul>`:''}

      ${ms.map((m,mi)=>{ const d=(toMin(m.fin)??0)-(toMin(m.inicio)??0); if(m.tipo==='Clase') n++; return `<tr class="${m.tipo!=='Clase'?'brk':''}">

V.asign = () => { const A=activeLevels(); if(!A.length) return noLevels();
  if(!A.includes(UI.asignLv)) UI.asignLv=A[0]; const l=UI.asignLv;
  const people=S.usuarios.filter(u=>(u.nombre||'').trim()||(u.apellido||'').trim()).sort((a,b)=>(a.rol==='Docente'?0:1)-(b.rol==='Docente'?0:1)||userName(a).localeCompare(userName(b)));
  const st=asignStats();
  const opts=sel=>'<option value="">Por definir</option>'+people.filter(u=>!(u.niveles&&u.niveles.length)||u.niveles.includes(l)||u.id===sel).map(u=>`<option value="${u.id}" ${u.id===sel?'selected':''}>${esc(userName(u))}${u.rol!=='Docente'?' · '+u.rol:''}</option>`).join('');
  let body='', any=false;
  if(!people.length) body+='<div class="alert warn">Primero cargá las personas en el paso <b>Usuarios</b>.</div>';
  (S.cursos[l]||[]).forEach((c,ci)=>{ const ms=(S.materias[l]||[]).map((m,mi)=>[m,mi]).filter(([m])=>((m.horas||{})[c.id]||0)>0); if(!ms.length||!c.divisiones.length) return; any=true;
    body+=`<div class="sub"><h4>${esc(c.nombre)}</h4><div class="tablewrap"><table class="t asg"><thead><tr><th>Materia</th><th class="c">Mód.</th>${c.divisiones.map(d=>`<th>División ${esc(d.nombre)}</th>`).join('')}${c.divisiones.length>1?'<th></th>':''}</tr></thead><tbody>
    ${ms.map(([m,mi])=>`<tr><td>${esc(m.nombre)}</td><td class="c mut">${m.horas[c.id]}</td>${c.divisiones.map(d=>{ const k=d.id+'|'+m.id; return `<td><select data-path="asign.${k}" data-change="asignUpd" class="${S.asign[k]?'':'empty-sel'}">${opts(S.asign[k])}</select></td>`; }).join('')}${c.divisiones.length>1?`<td><button class="btn sm ghost" data-act="asignCopy" data-lv="${l}" data-ci="${ci}" data-mi="${mi}" title="Copiar la primera división a todas">Igual en todas</button></td>`:''}</tr>`).join('')}
    </tbody></table></div></div>`; });
  if(!any) body+='<p class="empty">No hay materias con módulos en este nivel. Cargalos en el paso Materias.</p>';
  return `<div class="card"><div class="cardhead"><h3>¿Quién da cada materia?</h3><span class="pill" id="asg-pill">${st.done} de ${st.total} asignadas</span></div>

};

/* ---------- render ---------- */
function renderNav(){
  $('#steps').innerHTML = STEPS.map((s,i)=>{ const st=status(i); return `<li class="${i===S.step?'active':''} ${st}"><button data-act="go" data-i="${i}"><span class="dot">${st==='done'?'✓':i===0?'•':i}</span><span class="lbl">${s.t}</span></button></li>`; }).join('');
  const done=STEPS.slice(1,9).filter((s,k)=>status(k+1)==='done').length;
  $('#prog').innerHTML = `${done} de 8 pasos completos<div class="bar"><div style="width:${done/8*100}%"></div></div>`;
}
function renderPend(){
  const p=$('#pend'); if(!p) return;
  if(!UI.tried[S.step]){ p.innerHTML=''; return; }
  const c=check(STEPS[S.step].id);
  p.innerHTML = (c.err.length||c.warn.length) ? `<div class="alert ${c.err.length?'bad':'warn'}"><b>Pendientes en este paso</b><ul>${c.err.map(e=>`<li>${esc(e)}</li>`).join('')}${c.warn.map(e=>`<li class="w">${esc(e)}</li>`).join('')}</ul></div>` : '';
}
function updTotals(){ document.querySelectorAll('[data-tot]').forEach(td=>{ const [l,cid]=td.dataset.tot.split('|'); td.textContent=(S.materias[l]||[]).reduce((s,m)=>s+((m.horas||{})[cid]||0),0); }); }
function render(scroll){
  renderNav(); const s=STEPS[S.step], last=STEPS.length-1;
  $('#view').innerHTML = (S.step>0 ? `<div class="head"><span class="eyebrow">Paso ${S.step} de ${last}</span><h2>${s.t}</h2><p class="hint">${s.sub||''}</p></div>` : '') + V[s.id]() + (S.step>0&&S.step<last ? '<div id="pend"></div>' : '');
  renderPend(); updTotals();
  $('#navbtns').innerHTML = S.step===0 ? '' : `<button class="btn ghost" data-act="go" data-i="${S.step-1}">← Anterior</button>${S.step<last?`<button class="btn primary" data-act="next">${S.step===last-1?'Ir a la revisión →':'Siguiente →'}</button>`:''}`;
  if(scroll) window.scrollTo({top:0,behavior:'smooth'});
}
function goTo(i){
  if(i<0||i>=STEPS.length) return;
  UI.tried[S.step]=true; if(!S.visited.includes(S.step)) S.visited.push(S.step);
  S.step=i; save(); render(true);
}

/* ---------- acciones ---------- */
const ACT = {
  go: d => goTo(+d.i),
  next: () => goTo(S.step+1),
  reset: async () => { if(!await ask('¿Borrar todos los datos cargados en este navegador y empezar de cero?','Borrar todo')) return;
    for(const k in memFiles) delete memFiles[k];
    try{ if(IDB.db){ IDB.db.close(); IDB.db=null; } indexedDB.deleteDatabase('sabium-alta'); }catch(e){}
    S=blank(); save(); render(true); },
  toggleLevel: d => { const n=S.niveles[d.lv]; n.on=!n.on; if(n.on){ if(!n.turnos.length) n.turnos=['Mañana']; ensureLevel(d.lv); } save(); render(); },
  toggleTurno: d => { const n=S.niveles[d.lv], i=n.turnos.indexOf(d.t); if(i>=0) n.turnos.splice(i,1); else n.turnos.push(d.t); n.turnos.sort((a,b)=>TURNOS.indexOf(a)-TURNOS.indexOf(b)); fixTurnos(d.lv); save(); render(); },
  addCurso: d => { S.cursos[d.lv].push({id:uid(), nombre:'Nuevo curso', divisiones:[newDiv(d.lv,0)]}); save(); render(); },
  delCurso: async d => { const c=S.cursos[d.lv][+d.ci]; if(await ask(`¿Eliminar "${c.nombre}"?`,'Eliminar')){ S.cursos[d.lv].splice(+d.ci,1); save(); render(); } },
  divPlus: d => { const c=S.cursos[d.lv][+d.ci]; c.divisiones.push(newDiv(d.lv,c.divisiones.length,c.divisiones[c.divisiones.length-1])); save(); render(); },
  divMinus: d => { const c=S.cursos[d.lv][+d.ci]; if(c.divisiones.length) c.divisiones.pop(); save(); render(); },
  addMod: d => { const arr=modArr(d.lv,d.t), last=arr[arr.length-1], lc=[...arr].reverse().find(m=>m.tipo==='Clase');
    const dur = lc && toMin(lc.fin)>toMin(lc.inicio) ? toMin(lc.fin)-toMin(lc.inicio) : 40;
    const ini = last && toMin(last.fin)!=null ? last.fin : (d.t==='Tarde'?'13:00':d.t==='Noche'?'18:30':'07:45');
    arr.push({id:uid(), inicio:ini, fin:fromMin(toMin(ini)+dur), tipo:'Clase'}); save(); render(); },
  delMod: d => { modArr(d.lv,d.t).splice(+d.mi,1); save(); render(); },
  genToggle: d => { UI.gen[d.k]=!UI.gen[d.k]; render(); },
  gen: async d => { const g=x=>document.getElementById('g'+d.k+x).value;
    const ini=toMin(g('i')), dur=+g('d'), n=+g('n'), cada=+g('c'), rec=+g('r');
    if(ini==null||!(dur>0)||!(n>0)){ toast('Revisá los valores del generador'); return; }
    if(modArr(d.lv,d.t).length && !await ask('Esto reemplaza los módulos cargados en este turno. ¿Continuar?','Reemplazar')) return;
    const out=[]; let t=ini;
    for(let k=1;k<=n;k++){ out.push({id:uid(),inicio:fromMin(t),fin:fromMin(t+dur),tipo:'Clase'}); t+=dur;
      if(cada>0&&rec>0&&k%cada===0&&k<n){ out.push({id:uid(),inicio:fromMin(t),fin:fromMin(t+rec),tipo:'Recreo'}); t+=rec; } }
    S.modulos[d.lv][d.t]=out; UI.gen[d.k]=false; save(); render(); toast('Grilla generada'); },
  addMat: d => addMateria(d.lv,d.n),
  addMatInput: d => { const i=document.getElementById('nm-'+d.lv), n=i.value.trim(); if(!n) return; addMateria(d.lv,n); setTimeout(()=>{ const j=document.getElementById('nm-'+d.lv); j&&j.focus(); },0); },
  delMat: async d => { const m=S.materias[d.lv][+d.mi]; if(await ask(`¿Eliminar "${m.nombre||'la materia'}"?`,'Eliminar')){ S.materias[d.lv].splice(+d.mi,1); save(); render(); } },
  paste: () => { const ta=$('#paste'), list=parsePaste(ta.value,$('#paste-rol').value);
    if(!list.length){ toast('No encontramos filas para agregar'); return; }
    let nuevos=0, ya=0;
    list.forEach(u=>{ const ex=S.usuarios.find(x=>(u.dni&&String(x.dni).replace(/[.\s]/g,'')===u.dni)||(u.email&&(x.email||'').toLowerCase()===u.email));
      if(ex){ ['nombre','apellido','dni','email','telefono'].forEach(k=>{ if(u[k]&&!ex[k]) ex[k]=u[k]; }); ya++; } else { S.usuarios.push(u); nuevos++; } });
    ta.value=''; UI.rolFilter=''; save(); render(); toast(`${nuevos} persona(s) agregada(s)${ya?` · ${ya} ya estaban cargadas`:''}`); },
  addMode: d => { UI.addMode=d.v; if(d.v==='mano'&&!S.usuarios.length){ ACT.addUser(); return; } render(); },
  rolFilter: d => { UI.rolFilter=d.r; render(); },
  addUser: () => { UI.rolFilter=''; S.usuarios.push({id:uid(),nombre:'',apellido:'',dni:'',email:'',telefono:'',rol:S.usuarios.some(u=>u.rol==='Director/a general')?'Docente':'Director/a general',niveles:[]}); save(); render();
    setTimeout(()=>{ const r=document.querySelectorAll('table.users tbody tr'); const i=r.length&&r[r.length-1].querySelector('input'); i&&i.focus(); },0); },
  delUser: async d => { const u=S.usuarios[+d.i]; if(await ask(`¿Quitar a ${userName(u)}?`,'Quitar')){ S.usuarios.splice(+d.i,1); save(); render(); } },
  sortUsers: () => { S.usuarios.sort((a,b)=>(a.apellido||'').localeCompare(b.apellido||'')||(a.nombre||'').localeCompare(b.nombre||'')); save(); render(); },
  userLv: d => { const u=S.usuarios[+d.i]; u.niveles=u.niveles||[]; const k=u.niveles.indexOf(d.lv); k>=0?u.niveles.splice(k,1):u.niveles.push(d.lv); save(); render(); },
  asignLv: d => { UI.asignLv=d.lv; render(); },
  asignCopy: d => { const c=S.cursos[d.lv][+d.ci], m=S.materias[d.lv][+d.mi], v=S.asign[c.divisiones[0].id+'|'+m.id]||''; c.divisiones.forEach(x=>S.asign[x.id+'|'+m.id]=v); save(); render(); },
  horModo: d => { S.horModo[d.lv]=d.v; save(); render(); },
  delHor: d => { const f=S.horArch[d.lv][+d.fi]; S.horArch[d.lv].splice(+d.fi,1); delFile(f.id); save(); render(); },
  currModo: d => { S.curricular[d.lv].modo=d.v; save(); render(); },
  delCurr: d => { const c=S.curricular[d.lv], f=c.archivos[+d.fi]; c.archivos.splice(+d.fi,1); delFile(f.id); save(); render(); },
  delLogo: () => { if(S.inst.logo) delFile(S.inst.logo.id); S.inst.logo=null; save(); render(); },
  xlsx: () => exportXlsx(),
  saveJson: () => exportJson(),
  send: () => enviar()
};
const CH = {
  nomen: el => { const l=el.dataset.lv; S.nomen[l]=el.value; if(el.value!=='libre') S.cursos[l].forEach(c=>c.divisiones.forEach((d,i)=>d.nombre=divName(el.value,i))); save(); render(); },
  copyMods: el => { if(!el.value) return; const [a,b]=el.value.split('|'); S.modulos[el.dataset.lv][el.dataset.t]=((S.modulos[a]||{})[b]||[]).map(m=>({...m,id:uid()})); save(); render(); toast('Horarios copiados'); },
  allHours: el => { if(el.value==='') return; const l=el.dataset.lv, m=S.materias[l][+el.dataset.mi], v=Math.max(0,+el.value||0); m.horas=m.horas||{}; S.cursos[l].forEach(c=>m.horas[c.id]=v); save(); render(); },
  asignUpd: el => { el.classList.toggle('empty-sel',!el.value); const st=asignStats(), p=$('#asg-pill'); if(p) p.textContent=`${st.done} de ${st.total} asignadas`; }
};

/* ---------- pegado desde Excel ---------- */
function detectRol(c){ const s=c.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(/director.*general|rector|representante legal/.test(s)) return 'Director/a general';
  if(/directiv|vicedirect|vicerrect|secretari|director/.test(s)) return 'Equipo directivo';
  if(/coordin/.test(s)) return 'Coordinador/a';
  if(/docente|profesor|maestr/.test(s)) return 'Docente';
  return ''; }
function parsePaste(txt,defRol){
  const out=[];
  for(const line of txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean)){
    let cells = line.includes('\t') ? line.split('\t') : line.includes(';') ? line.split(';') : ((line.match(/,/g)||[]).length>=2 ? line.split(',') : [line]);
    cells = cells.map(c=>c.trim()).filter(Boolean); if(!cells.length) continue;
    const hasEmail=cells.some(c=>/@/.test(c)), hasDni=cells.some(c=>/^\d{7,8}$/.test(c.replace(/[.\s]/g,'')));
    if(!hasEmail && !hasDni && /\b(nombre|apellido|email|correo|dni|mail)\b/i.test(cells.join(' '))) continue; // encabezado
    const u={id:uid(),nombre:'',apellido:'',dni:'',email:'',telefono:'',rol:'',niveles:[]}, rest=[];
    for(const c of cells){ const cd=c.replace(/[.\s]/g,'');
      if(!u.email && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c)) u.email=c.toLowerCase();
      else if(!u.dni && /^\d{7,8}$/.test(cd)) u.dni=cd;
      else if(!u.telefono && /^[+\d()\s.-]{8,}$/.test(c) && c.replace(/\D/g,'').length>=8) u.telefono=c;
      else if(!u.rol && detectRol(c)) u.rol=detectRol(c);
      else rest.push(c); }
    if(rest.length>=2){ u.nombre=rest[0]; u.apellido=rest[1]; }
    else if(rest.length===1){ const r=rest[0]; if(r.includes(',')){ const [a,b]=r.split(','); u.apellido=a.trim(); u.nombre=(b||'').trim(); } else { const w=r.split(/\s+/); u.apellido=w.length>1?w.pop():''; u.nombre=w.join(' '); } }
    u.rol=u.rol||defRol; out.push(u);
  }
  return out;
}

/* ---------- archivos ---------- */
function makeThumb(f){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(f), img=new Image();
  img.onload=()=>{ const w=img.naturalWidth||240, h=img.naturalHeight||240, s=Math.min(1,240/Math.max(w,h)); const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w*s)); c.height=Math.max(1,Math.round(h*s)); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/png')); };
  img.onerror=e=>{ URL.revokeObjectURL(url); rej(e); }; img.src=url; }); }
async function onFiles(kind,lv,files){
  files=[...(files||[])]; if(!files.length) return;
  if(kind==='import'){ importJson(files[0]); return; }
  const max=CONFIG.maxFileMB*1048576, ok=files.filter(f=>{ if(f.size>max){ toast(`"${f.name}" supera los ${CONFIG.maxFileMB} MB`); return false; } return true; });
  if(kind==='logo'){ const f=ok[0]; if(!f) return; if(!/^image\//.test(f.type)){ toast('El logo tiene que ser una imagen (PNG, JPG o SVG)'); return; }
    if(S.inst.logo) delFile(S.inst.logo.id); const id=uid(); await putFile(id,f); let thumb=''; try{ thumb=await makeThumb(f); }catch(e){}
    S.inst.logo={id,name:f.name,type:f.type,size:f.size,thumb}; save(); render(); return; }
  if(kind==='hor'){ for(const f of ok){ const id=uid(); await putFile(id,f); S.horArch[lv].push({id,name:f.name,type:f.type,size:f.size}); } save(); render(); return; }
  if(kind==='curr'){ const c=S.curricular[lv]; for(const f of ok){ const id=uid(); await putFile(id,f); c.archivos.push({id,name:f.name,type:f.type,size:f.size}); } save(); render(); }
}

/* ---------- exportación y envío ---------- */
function tablas(){
  const A=activeLevels(), i=S.inst, c=S.contacto, T={};
  T['Institución']=[['Campo','Valor'],['Nombre',i.nombre],['Razón social',i.razon],['CUIT',String(i.cuit).replace(/\D/g,'')],['Dirección',i.direccion],['Localidad',i.localidad],['Provincia',i.provincia],['País',i.pais],['Teléfono',i.telefono],['Email institucional',i.email],['Sitio web',i.web],['Logo',i.logo?i.logo.name:''],
    ['Contacto - Nombre',c.nombre],['Contacto - Cargo',c.cargo],['Contacto - Email',c.email],['Contacto - Teléfono',c.telefono],['Inicio de clases',S.ciclo.inicio],['Fin de clases',S.ciclo.fin],['Organización del año',S.ciclo.periodo]];
  T['Niveles']=[['Nivel','Turnos','Horarios']].concat(A.map(l=>[lvLabel(l),S.niveles[l].turnos.join(', '),S.horModo[l]==='archivo'?'Archivo: '+(S.horArch[l]||[]).map(f=>f.name).join(', '):'Cargados en el asistente (pestaña Horarios)']));
  T['Cursos y divisiones']=[['Nivel','Curso','División','Turno']]; A.forEach(l=>(S.cursos[l]||[]).forEach(cu=>cu.divisiones.forEach(d=>T['Cursos y divisiones'].push([lvLabel(l),cu.nombre,d.nombre,d.turno]))));
  T['Horarios']=[['Nivel','Turno','Módulo','Inicio','Fin','Tipo','Minutos']]; A.filter(l=>S.horModo[l]!=='archivo').forEach(l=>S.niveles[l].turnos.forEach(t=>{ let n=0; ((S.modulos[l]||{})[t]||[]).forEach(m=>{ if(m.tipo==='Clase') n++; T['Horarios'].push([lvLabel(l),t,m.tipo==='Clase'?n:'',m.inicio,m.fin,m.tipo,(toMin(m.fin)??0)-(toMin(m.inicio)??0)]); }); }));
  T['Materias']=[['Nivel','Materia','Curso','Módulos semanales']]; A.forEach(l=>(S.materias[l]||[]).forEach(m=>(S.cursos[l]||[]).forEach(cu=>{ const h=(m.horas||{})[cu.id]||0; if(h>0) T['Materias'].push([lvLabel(l),m.nombre,cu.nombre,h]); })));
  T['Usuarios']=[['Cargo','Apellido','Nombre','DNI','Email','Teléfono','Niveles']].concat(S.usuarios.map(u=>[u.rol,u.apellido,u.nombre,String(u.dni).replace(/[.\s]/g,''),u.email,u.telefono,((u.niveles&&u.niveles.length)?u.niveles.filter(x=>A.includes(x)):A).map(x=>lvLabel(x)).join(', ')]));
  T['Asignaciones']=[['Nivel','Curso','División','Materia','Módulos semanales','Docente','DNI docente','Email docente']]; A.forEach(l=>asignRows(l).forEach(r=>{ const u=S.usuarios.find(x=>x.id===S.asign[r.key]); T['Asignaciones'].push([lvLabel(l),r.c.nombre,r.d.nombre,r.m.nombre,r.h,u?userName(u):'Por definir',u?u.dni:'',u?u.email:'']); }));
  const MOD={archivo:'Archivos adjuntos',mail:'Lo envían por mail',ayuda:'Necesitan ayuda'};
  T['Diseño curricular']=[['Nivel','Modalidad','Archivos','Comentarios']].concat(A.map(l=>{ const cc=S.curricular[l]||{}; return [lvLabel(l),MOD[cc.modo]||'Sin indicar',(cc.archivos||[]).map(f=>f.name).join(', '),cc.nota||'']; }));
  return T;
}
const fileBase = () => 'Sabium-alta-'+((S.inst.nombre||'institucion').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').slice(0,40)||'institucion');
async function offerDownload(filename,blob){
  let dl=null;
  if(window.claude && typeof window.claude.use==='function'){ try{ dl=await Promise.race([window.claude.use('downloads'),new Promise(r=>setTimeout(()=>r(null),3000))]); }catch(e){} }
  if(dl){ try{ await dl.save({filename,data:blob}); toast('Archivo descargado'); }catch(e){ if(!e||e.code!=='declined') toast('No se pudo descargar en esta vista'); } return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
}
async function exportXlsx(){
  if(typeof XLSX==='undefined'){ toast('No se pudo cargar el generador de Excel. Revisá tu conexión.'); return; }
  const wb=XLSX.utils.book_new();
  for(const [n,rows] of Object.entries(tablas())){ const ws=XLSX.utils.aoa_to_sheet(rows); ws['!cols']=rows[0].map((_,k)=>({wch:Math.min(45,Math.max(10,...rows.map(r=>String(r[k]??'').length+2)))})); XLSX.utils.book_append_sheet(wb,ws,n.slice(0,31)); }
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  await offerDownload(fileBase()+'.xlsx',new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}
const toB64 = b => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=rej; r.readAsDataURL(b); });
function fromB64(s,type){ const bin=atob(s), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type}); }
async function fullPayload(){
  const refs=[]; if(S.inst.logo) refs.push([S.inst.logo,'Logo']);
  activeLevels().forEach(l=>{ if(S.horModo[l]==='archivo') (S.horArch[l]||[]).forEach(f=>refs.push([f,'Horarios - '+lvLabel(l)])); });
  activeLevels().forEach(l=>((S.curricular[l]||{}).archivos||[]).forEach(f=>refs.push([f,'Diseño curricular - '+lvLabel(l)])));
  const archivos=[], faltan=[];
  for(const [f,ctx] of refs){ const b=await getFile(f.id); if(!b){ faltan.push(f.name); continue; } archivos.push({id:f.id,nombre:f.name,tipo:f.type||'application/octet-stream',contexto:ctx,base64:await toB64(b)}); }
  if(faltan.length) toast('Volvé a subir estos archivos: '+faltan.join(', '));
  return {formato:'sabium-alta', version:1, generado:new Date().toISOString(), datos:S, tablas:tablas(), archivos};
}
async function exportJson(){ const p=await fullPayload(); await offerDownload(fileBase()+'.json',new Blob([JSON.stringify(p)],{type:'application/json'})); }
async function importJson(file){
  try{ const p=JSON.parse(await file.text()); if(p.formato!=='sabium-alta'||!p.datos) throw new Error('formato');
    if(hasData() && !await ask('Esto reemplaza los datos cargados en este navegador por los del archivo. ¿Continuar?','Importar')) return;
    S=Object.assign(blank(),p.datos); for(const a of p.archivos||[]) await putFile(a.id,fromB64(a.base64,a.tipo));
    activeLevels().forEach(ensureLevel); save(); render(true); toast('Avance importado');
  }catch(e){ toast('El archivo no es un avance de Sabium válido'); }
}
async function enviar(){
  const msg=$('#sendmsg');
  if(!S.confirmado){ msg.innerHTML='<div class="alert warn">Marcá la confirmación antes de enviar.</div>'; return; }
  if(!CONFIG.endpoint){ msg.innerHTML=`<div class="alert warn">El envío automático todavía no está activado. Descargá el Excel y el avance (.json) y envialos a <b>${esc(CONFIG.contacto)}</b>.</div>`; return; }
  const b=document.querySelector('[data-act=send]'); b.disabled=true; b.textContent='Enviando…';
  try{
    const p=await fullPayload();
    const r=await fetch(CONFIG.endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});
    let j=null; try{ j=await r.json(); }catch(e){}
    if(!r.ok || (j && j.ok===false)) throw new Error((j&&j.error)||('HTTP '+r.status));
    S.enviado={fecha:new Date().toISOString(), id:(j&&j.id)||''}; save(); render();
  }catch(e){
    b.disabled=false; b.textContent='Enviar a Sabium';
    msg.innerHTML=`<div class="alert bad">No pudimos enviar los datos (${esc(e.message||'error de conexión')}). Probá de nuevo en unos minutos, o descargá el Excel y el avance (.json) y envialos a <b>${esc(CONFIG.contacto)}</b>.</div>`;
  }
}

/* ---------- modal y aviso ---------- */
function ask(text,ok='Aceptar'){ return new Promise(res=>{ const m=$('#modal');
  m.innerHTML=`<div class="mbg"><div class="mbox" role="dialog"><p>${esc(text)}</p><div class="row end"><button class="btn ghost" id="mno">Cancelar</button><button class="btn primary" id="mok">${esc(ok)}</button></div></div></div>`;
  const close=v=>{ m.innerHTML=''; res(v); }; $('#mno').onclick=()=>close(false); $('#mok').onclick=()=>close(true); $('#mok').focus(); }); }
let tT; function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(tT); tT=setTimeout(()=>el.classList.remove('show'),3400); }

/* ---------- eventos ---------- */
function bind(el){
  let v = el.type==='checkbox' ? el.checked : el.value;
  if(el.type==='number') v = el.value==='' ? 0 : Math.max(0,Number(el.value)||0);
  setPath(S,el.dataset.path,v); save(); renderNav(); renderPend();
  if(el.type==='time'){ const tr=el.closest('tr'); if(tr){ const [a,b]=tr.querySelectorAll('input[type=time]'); const d=(toMin(b.value)??0)-(toMin(a.value)??0); const c=tr.querySelector('td.mut'); if(c) c.textContent=d>0?d:'–'; } }
  if(el.dataset.path.startsWith('materias.')) updTotals();
  if(el.dataset.v && validV(el.dataset.v,el.value)) el.classList.remove('bad');
}
document.addEventListener('input',e=>{ const el=e.target; if(!el.dataset||!el.dataset.path) return; if(el.tagName==='SELECT'||el.type==='checkbox') return; bind(el); });
document.addEventListener('change',e=>{ const el=e.target; if(!el.dataset) return;
  if(el.dataset.file!==undefined){ onFiles(el.dataset.file,el.dataset.lv,el.files); el.value=''; return; }
  if(el.dataset.path && (el.tagName==='SELECT'||el.type==='checkbox')) bind(el);
  if(el.dataset.change) CH[el.dataset.change](el);
  if(el.dataset.rerender!==undefined) render(); });
document.addEventListener('focusout',e=>{ const el=e.target; if(el.dataset&&el.dataset.v) el.classList.toggle('bad',!!el.value&&!validV(el.dataset.v,el.value)); });
document.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b||b.disabled) return; const f=ACT[b.dataset.act]; if(f){ e.preventDefault(); f(b.dataset,b); } });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter){ e.preventDefault(); ACT[e.target.dataset.enter](e.target.dataset); } if(e.key==='Escape'&&$('#mno')) $('#mno').click(); });
window.addEventListener('dragover',e=>{ e.preventDefault(); const z=e.target.closest&&e.target.closest('.dz'); document.querySelectorAll('.dz.over').forEach(x=>x!==z&&x.classList.remove('over')); if(z) z.classList.add('over'); });
window.addEventListener('drop',e=>{ e.preventDefault(); const z=e.target.closest&&e.target.closest('.dz'); document.querySelectorAll('.dz.over').forEach(x=>x.classList.remove('over')); if(z) onFiles(z.dataset.dz,z.dataset.lv,e.dataTransfer.files); });

/* ---------- inicio ---------- */
$('#helpmail').textContent = CONFIG.contacto;
activeLevels().forEach(ensureLevel);
if(hasData()) $('#save').textContent='✓ Avance recuperado';
render();
</script>
